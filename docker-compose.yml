services:
  db:
    image: postgres:16-alpine
    container_name: qpms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qpms
      POSTGRES_PASSWORD: qpms_dev_password
      POSTGRES_DB: qpms
    ports:
      - "5433:5432"
    volumes:
      - qpms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qpms -d qpms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qpms_pgdata:
