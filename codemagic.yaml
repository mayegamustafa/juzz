workflows:
  android-teacher-app:
    name: Juzz Tracking - Android
    # instance_type is deliberately unset: pinning one (linux_x2, mac_mini_m2)
    # fails outright on plans that do not include it. Codemagic then picks a
    # machine the current plan allows. Pin it only if a build is too slow.
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        # One group holds everything, so there is a single thing to create in
        # Codemagic (Settings > Environment variables) rather than several.
        # Codemagic fails the build outright if the group does not exist, so it
        # must be created even while some variables inside it are still blank.
        # See docs/mobile-releases.md for the full list.
        - juzz_release
      android_signing:
        # Upload the keystore once under Codemagic > Code signing identities >
        # Android keystores, using this reference name. Every build must use the
        # SAME keystore: Android refuses to install an update over an existing
        # app if the signature changed, which would force Sheikhs to uninstall
        # and lose their offline data.
        - juzz_keystore
    scripts:
      - name: Get packages
        working_directory: apps/mobile
        script: flutter pub get

      - name: Analyze
        working_directory: apps/mobile
        script: flutter analyze

      - name: Test
        working_directory: apps/mobile
        script: flutter test

      # Push notifications need this file at build time. Store it as a secure
      # base64 variable (base64 -w0 google-services.json). Left unset, the build
      # still succeeds and the app falls back to polling while it is open.
      - name: Write google-services.json
        working_directory: apps/mobile
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json written; push notifications enabled."
          else
            echo "GOOGLE_SERVICES_JSON not set; building without push notifications."
          fi

      # Codemagic increments PROJECT_BUILD_NUMBER on every build of this
      # workflow. Using it as the Android versionCode is what makes each APK
      # count as newer than the last: Android will not install an APK whose
      # versionCode is not greater than the one already installed.
      - name: Build signed APK
        working_directory: apps/mobile
        script: |
          set -e

          # An empty API_BASE_URL builds an APK that falls back to the Android
          # emulator's localhost alias, so it installs and signs in to nothing.
          # That is a silent failure discovered only on a Sheikh's phone, so
          # stop here instead.
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is not set." >&2
            echo "Add it to the 'juzz_release' variable group in Codemagic, e.g." >&2
            echo "  API_BASE_URL = https://api.juzz.sakcps.org/api" >&2
            exit 1
          fi
          echo "Building against $API_BASE_URL"

          BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          VERSION_NAME="1.0.$BUILD_NUMBER"
          echo "Building versionCode=$BUILD_NUMBER versionName=$VERSION_NAME"

          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --build-name="$VERSION_NAME" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

          # Fail loudly rather than ship a debug-signed APK, which would not
          # install over an existing release-signed install.
          #
          # Verify with apksigner, not `keytool -printcert -jarfile`: keytool
          # only reads the legacy v1 JAR signature, which current AGP no longer
          # writes, so it reports a correctly v2/v3-signed APK as unsigned.
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under $SDK_ROOT; cannot verify the signature." >&2
            exit 1
          fi

          # Non-zero exit here means genuinely unsigned, and set -e stops the build.
          "$APKSIGNER" verify --print-certs "$APK"

          # Every release must use the one keystore, or Android treats the next
          # update as a different app and refuses to install it over this one.
          EXPECTED=6bc225c89626954459c9458370746bb818e1caf2d98b825a7ae289b6759e1366
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "WARNING: signed with an unexpected certificate." >&2
            echo "  expected $EXPECTED" >&2
            echo "  actual   $ACTUAL" >&2
            echo "Installs signed with the previous key will NOT accept this as an update." >&2
          else
            echo "Signature matches the expected release keystore."
          fi

    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - apps/mobile/build/**/mapping.txt

    publishing:
      scripts:
        # Attach the APK to a GitHub release so it has a stable public download
        # URL, then tell the API about it. Sheikhs are prompted to update the
        # next time they open the app; installing over the old app keeps their
        # data and login, because the signing key is unchanged.
        - name: Publish release and notify the API
          script: |
            set -e
            BUILD_NUMBER=$PROJECT_BUILD_NUMBER
            VERSION_NAME="1.0.$BUILD_NUMBER"
            TAG="v$VERSION_NAME"
            APK="$CM_BUILD_DIR/apps/mobile/build/app/outputs/flutter-apk/app-release.apk"

            if [ -z "$GITHUB_TOKEN" ] || [ -z "$PUBLISH_PASSWORD" ]; then
              echo "Publishing credentials not set; skipping."
              echo "Download the APK from this build and publish it from the Teacher app admin page."
              exit 0
            fi

            # 1. Create the GitHub release.
            curl -sS -X POST "https://api.github.com/repos/$GITHUB_REPO/releases" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Automated build $BUILD_NUMBER\"}" \
              -o /tmp/release.json

            UPLOAD_URL=$(grep -o '"upload_url": *"[^"]*' /tmp/release.json | head -1 | cut -d'"' -f4 | sed 's/{.*}//')
            if [ -z "$UPLOAD_URL" ]; then
              echo "Could not create the GitHub release:" >&2
              cat /tmp/release.json >&2
              exit 1
            fi

            # 2. Upload the APK as a release asset.
            curl -sS -X POST "$UPLOAD_URL?name=juzz-tracking-$VERSION_NAME.apk" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK" -o /tmp/asset.json

            DOWNLOAD_URL=$(grep -o '"browser_download_url": *"[^"]*' /tmp/asset.json | head -1 | cut -d'"' -f4)
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "APK upload failed:" >&2
              cat /tmp/asset.json >&2
              exit 1
            fi
            echo "APK published at $DOWNLOAD_URL"

            # 3. Register the release with the API so the app offers the update.
            TOKEN=$(curl -sS -X POST "$PUBLISH_API_URL/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$PUBLISH_EMAIL\",\"password\":\"$PUBLISH_PASSWORD\"}" \
              | grep -o '"accessToken": *"[^"]*' | cut -d'"' -f4)

            if [ -z "$TOKEN" ]; then
              echo "Could not sign in to the API to publish the release." >&2
              exit 1
            fi

            curl -sS -X POST "$PUBLISH_API_URL/app-release" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"versionCode\":$BUILD_NUMBER,\"versionName\":\"$VERSION_NAME\",\"downloadUrl\":\"$DOWNLOAD_URL\",\"releaseNotes\":\"Automated build $BUILD_NUMBER\",\"mandatory\":false}"

            echo "Release $VERSION_NAME published. Sheikhs are offered it on next app open."

      email:
        recipients:
          - mayegamus@gmail.com
        notify:
          success: true
          failure: true

  ios-teacher-app:
    name: Juzz Tracking - iOS
    # Must run on macOS, but leave the exact machine to the plan (see above).
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - juzz_release
      vars:
        BUNDLE_ID: "com.juzz.app"
      # Requires an App Store Connect integration configured in the Codemagic UI:
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.juzz.app
    scripts:
      - name: Get packages
        working_directory: apps/mobile
        script: flutter pub get

      - name: Analyze and test
        working_directory: apps/mobile
        script: |
          flutter analyze
          flutter test

      - name: Install pods
        working_directory: apps/mobile/ios
        script: pod install

      # Signing is required for `flutter build ipa`. Until certificates are set up
      # in Codemagic, this produces an unsigned .app so the build stays verifiable.
      - name: Build iOS (no codesign)
        working_directory: apps/mobile
        script: |
          flutter build ios --release --no-codesign \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --build-name="1.0.$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - apps/mobile/build/ios/iphoneos/*.app
      - apps/mobile/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mayegamus@gmail.com
        notify:
          success: true
          failure: true
